<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricPulse Editor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .nudge-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .nudge-btn { background: #333; color: #00adb5; border: 1px solid #00adb5; padding: 8px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; flex: 1; }
        .nudge-btn:hover { background: #00adb5; color: white; }
        .lcd-preview { background: #002b00; color: #00ff00; font-family: 'Courier New', monospace; padding: 10px; border-radius: 4px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <p><a href="/library" style="color: #00adb5; text-decoration: none;">← Back to Library</a></p>
        
        <div class="card">
            <h2>Timing Shift (Spotify Sync)</h2>
            <p>Nudge all lyric timestamps forward or backward:</p>
            <div class="nudge-group">
                <button class="nudge-btn" onclick="nudgeLyrics(-0.2)">-200ms</button>
                <button class="nudge-btn" onclick="nudgeLyrics(-0.05)">-50ms</button>
                <button class="nudge-btn" onclick="nudgeLyrics(0.05)">+50ms</button>
                <button class="nudge-btn" onclick="nudgeLyrics(0.2)">+200ms</button>
            </div>
        </div>
    </div>

    <script>
        async function nudgeLyrics(seconds) {
            const songId = window.location.pathname.split('/').pop();
            const res = await fetch(`/api/songs/${songId}/nudge`, {
                method: 'POST',
                headers: { 'Content-Type': 'json' },
                body: JSON.stringify({ offset_ms: seconds * 1000 })
            });

            if (res.ok) {
                location.reload();
            } else {
                alert('Failed to shift timestamps.');
            }
        }
    </script>
</body>
</html>
