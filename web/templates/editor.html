<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricPulse — Timing Sync</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #06b6d4; --text: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; margin: 0; }
        .container { max-width: 750px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .nudge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
        .nudge-btn { background: #0f172a; color: var(--accent); border: 1px solid var(--accent); padding: 12px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .nudge-btn:hover { background: var(--accent); color: #000; }
        a.back-link { color: var(--accent); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/library" class="back-link">← Back to Library</a>

        <div class="card">
            <h2 style="margin-top:0;">Spotify Timing Sync (Nudge Offset)</h2>
            <p style="color: #94a3b8; font-size: 0.95rem;">Shift all timestamps forward or backward to sync with your playing audio source:</p>

            <div class="nudge-grid">
                <button class="nudge-btn" onclick="nudgeLyrics(-200)">-200ms</button>
                <button class="nudge-btn" onclick="nudgeLyrics(-50)">-50ms</button>
                <button class="nudge-btn" onclick="nudgeLyrics(50)">+50ms</button>
                <button class="nudge-btn" onclick="nudgeLyrics(200)">+200ms</button>
            </div>
        </div>
    </div>

    <script>
        async function nudgeLyrics(offsetMs) {
            const songId = window.location.pathname.split('/').pop();
            try {
                const res = await fetch(`/api/songs/${songId}/nudge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ offset_ms: offsetMs })
                });

                if (res.ok) {
                    alert(`Timestamps shifted by ${offsetMs}ms!`);
                } else {
                    alert('Failed to nudge timestamps.');
                }
            } catch (err) {
                alert('Network error while nudging timestamps.');
            }
        }
    </script>
</body>
</html>
