<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricPulse — Advanced Editor</title>
    <style>
        :root { --bg: #090d16; --card: #151c2c; --accent: #06b6d4; --lcd-bg: #051a05; --lcd-text: #00ff66; --text: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e293b; }
        
        /* Hardware 1602 LCD Display Simulator */
        .lcd-simulator { background: var(--lcd-bg); color: var(--lcd-text); font-family: 'Courier New', monospace; padding: 16px; border-radius: 8px; border: 4px solid #000; box-shadow: 0 0 12px rgba(0,255,102,0.2); width: 280px; margin: 0 auto 16px auto; }
        .lcd-line { height: 22px; font-size: 1.2rem; font-weight: bold; letter-spacing: 3px; white-space: pre; }
        
        .timeline-row { display: grid; grid-template-columns: 80px 1fr 1fr 80px; gap: 10px; align-items: center; margin-bottom: 8px; background: #0f172a; padding: 8px; border-radius: 6px; }
        input { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 6px; border-radius: 4px; }
        .btn { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <p><a href="/library" style="color: var(--accent); text-decoration: none;">← Back to Track Library</a></p>

        <div class="card" style="text-align: center;">
            <h3 style="margin-top:0; color:#94a3b8;">1602A Hardware Live Simulator</h3>
            <div class="lcd-simulator">
                <div class="lcd-line" id="sim-line1">READY FOR SYNC  </div>
                <div class="lcd-line" id="sim-line2">LYRICPULSE 1602 </div>
            </div>
            <button class="btn btn-outline" onclick="triggerRemoteRecord()">⏺ Prepare Remote Recording</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0; color:#94a3b8;">Lyric Sentiment Analyzer</h3>
            <p id="sentiment-status">Click to analyze full LRC sentiment profile...</p>
            <button class="btn" onclick="runSentimentAnalysis()">Analyze Lyric Mood</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0; color:#94a3b8;">Lyric Line Timeline & Formatting</h3>
            <div id="timeline-container">
                </div>
        </div>
    </div>

    <script>
        const songId = window.location.pathname.split('/').pop();

        function updateSimulator(l1, l2) {
            document.getElementById('sim-line1').innerText = (l1 || '').padEnd(16, ' ').slice(0,16);
            document.getElementById('sim-line2').innerText = (l2 || '').padEnd(16, ' ').slice(0,16);
        }

        async function runSentimentAnalysis() {
            const res = await fetch(`/api/songs/${songId}/analyze-sentiment`);
            const data = await res.json();
            if (data.status === 'success') {
                document.getElementById('sentiment-status').innerText = 
                    `Suggested Mood: ${data.suggested_mood.toUpperCase()} (Confidence: ${Math.round(data.confidence * 100)}%)`;
            }
        }

        async function triggerRemoteRecord() {
            const res = await fetch('/api/remote/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ song_id: parseInt(songId) })
            });
            if (res.ok) alert('Remote playback triggered on Raspberry Pi!');
        }
    </script>
</body>
</html>
