<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricPulse — Track Library</title>
    <style>
        :root { --bg: #090d16; --card: #151c2c; --accent: #06b6d4; --danger: #ef4444; --text: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding: 24px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e293b; }
        .search-bar { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; margin-bottom: 12px; }
        .tag-pill { display: inline-block; background: #1e293b; color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--accent); margin-right: 6px; }
        .song-item { background: #0f172a; border-radius: 8px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-rec { background: var(--accent); color: #000; font-weight: bold; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ LyricPulse Library</h1>

        <div class="card">
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 Search songs by title or artist..." oninput="filterSongs()">
            <div>
                <span class="tag-pill" onclick="filterByTag('')">All</span>
                <span class="tag-pill" onclick="filterByTag('sad')">Sad</span>
                <span class="tag-pill" onclick="filterByTag('hype')">Hype</span>
                <span class="tag-pill" onclick="filterByTag('dark')">Dark</span>
            </div>
        </div>

        <div class="card">
            <h2>Songs</h2>
            <div id="song-container">
                {% for song in songs %}
                <div class="song-item">
                    <div>
                        <strong>{{ song.title }}</strong> <span style="color:#64748b">— {{ song.artist }}</span>
                    </div>
                    <div>
                        <button class="btn-rec" onclick="startRecord('{{ song.id }}')">⏺ Record</button>
                        <a href="/editor/{{ song.id }}" style="color:var(--accent); margin-left:10px; text-decoration:none;">Edit</a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        async function filterSongs() {
            const q = document.getElementById('search-input').value;
            const res = await fetch(`/api/songs/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            renderSongList(data.songs);
        }

        async function filterByTag(tag) {
            const res = await fetch(`/api/songs/search?tag=${encodeURIComponent(tag)}`);
            const data = await res.json();
            renderSongList(data.songs);
        }

        function renderSongList(songs) {
            const container = document.getElementById('song-container');
            container.innerHTML = songs.map(s => `
                <div class="song-item">
                    <div><strong>${s.title}</strong> <span style="color:#64748b">— ${s.artist}</span></div>
                    <div>
                        <button class="btn-rec" onclick="startRecord('${s.id}')">⏺ Record</button>
                        <a href="/editor/${s.id}" style="color:var(--accent); margin-left:10px; text-decoration:none;">Edit</a>
                    </div>
                </div>
            `).join('');
        }

        async function startRecord(songId) {
            await fetch('/api/recording/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ song_id: parseInt(songId), countdown_sec: 3 })
            });
            alert('Recording Mode Triggered! Check LCD Display.');
        }
    </script>
</body>
</html>
